services:
  auditai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditai-b2b-api
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - Gemini__PrimaryModel=${GEMINI_PRIMARY_MODEL:-gemini-3.5-flash-lite}
      - Gemini__FallbackModel=${GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:3000
    volumes:
      - auditai_uploads:/app/storage/uploads
    restart: unless-stopped

  auditai-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: auditai-b2b-web
    ports:
      - "3000:80"
    depends_on:
      - auditai-api
    restart: unless-stopped

volumes:
  auditai_uploads:
